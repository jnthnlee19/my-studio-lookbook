<script>
  function formatPrice(value) {
    const num = parseFloat(value);
    return isNaN(num) ? null : '$' + num.toLocaleString();
  }

  function parsePrice(value) {
    const num = parseFloat(value);
    return isNaN(num) ? 0 : num;
  }





function updateTotal() {
  let total = 0;
  const optionCards = document.querySelectorAll('.option');

  optionCards.forEach(card => {
    const checkbox = card.querySelector('input[type="checkbox"]');
    const qtyInput = card.querySelector('input[type="number"]');

    if (checkbox && checkbox.checked) {
      const price = parseFloat(checkbox.getAttribute('data-price')) || 0;
      const qty = parseInt(qtyInput?.value || 1);
      total += price * qty;
    }
  });

  const totalEl = document.getElementById('total-bar');
  if (totalEl) {
    totalEl.textContent = `Your Total: $${total.toLocaleString(undefined, { minimumFractionDigits: 2 })}`;
  }
}
function toggleAllSelections(masterCheckbox) {
  const allBoxes = document.querySelectorAll('.option input[type="checkbox"]');
  allBoxes.forEach(box => {
    box.checked = masterCheckbox.checked;
  });
  updateTotal();
}


  function expandAll() {
    document.querySelectorAll("details").forEach(el => el.open = true);
  }

  
function toggleAllSections() {
  const allDetails = document.querySelectorAll("details");
  const anyOpen = Array.from(allDetails).some(el => el.open);
  allDetails.forEach(el => el.open = !anyOpen);
}

function collapseAll() {
    document.querySelectorAll("details").forEach(el => el.open = false);
  }

<script>
function filterOptions() {
  const query = document.getElementById('search-input').value.toLowerCase();
  const allOptions = document.querySelectorAll('.option');
  let anyVisible = false;

  allOptions.forEach(opt => {
    const text = opt.innerText.toLowerCase();
    const matches = text.includes(query);

    opt.style.display = matches ? 'flex' : 'none';

    if (matches) anyVisible = true;
  });

  document.querySelectorAll('details.subcategory').forEach(sub => {
    const hasVisibleChild = Array.from(sub.querySelectorAll('.option')).some(opt => opt.style.display !== 'none');
    sub.style.display = hasVisibleChild ? '' : 'none';
    sub.open = hasVisibleChild; // Auto-expand if it has matches
  });

  document.querySelectorAll('#lookbook-container > details').forEach(cat => {
    const hasVisibleSub = Array.from(cat.querySelectorAll('details.subcategory')).some(sub => sub.style.display !== 'none');
    cat.style.display = hasVisibleSub ? '' : 'none';
    cat.open = hasVisibleSub;
  });
}

function clearSearch() {
  document.getElementById('search-input').value = '';
  filterOptions();
}
</script>

<script>
async function generatePage() {
  const pathParts = window.location.pathname.split("/");
  const currentSlug = pathParts[pathParts.length - 1].replace(".html", "").replace("/", "");
  const address = `${currentSlug}-wishlist`;

  const base64 = localStorage.getItem("workbook");
  if (!base64) return alert("Workbook not loaded. This page must be generated from the original file.");

  const loading = document.createElement("div");
  loading.textContent = "Generating wishlist page...";
  loading.style.cssText = "position:fixed;top:0;left:0;width:100%;height:100%;display:flex;justify-content:center;align-items:center;font-size:2rem;font-weight:bold;background:white;z-index:9999;";
  document.body.appendChild(loading);

  let total = 0;

  let html = `
  <!DOCTYPE html><html><head><meta charset="UTF-8">
  <title>${address}</title>
  <style>
    body { font-family: Segoe UI, sans-serif; padding: 2rem; }
    h2, h3 { color: #222; }
    .option { margin-bottom: 1rem; border-bottom: 1px solid #ccc; padding-bottom: 1rem; display: flex; align-items: flex-start; gap: 1rem; }
    .option img { width: 100px; height: 100px; object-fit: cover; border-radius: 6px; background: #eee; }
    .option-details { flex: 1; }
    .comment { margin-top: 0.5rem; font-style: italic; color: #555; }
    strong { display: block; margin-bottom: 0.25rem; }
    .total-line { font-weight: bold; font-size: 1.25rem; margin-top: 2rem; border-top: 2px solid #ccc; padding-top: 1rem; }
  </style></head><body>
  <h2>My Wishlist</h2>`;

  html += document.getElementById("house-info")?.innerHTML || '';

  const allCategories = document.querySelectorAll("details:not(.subcategory)");
  allCategories.forEach(cat => {
    const catTitle = cat.querySelector("summary")?.textContent || "";
    let catHasSelections = false;
    let catContent = `<h3>${catTitle}</h3>`;

    const options = cat.querySelectorAll(".option");
    options.forEach(opt => {
      const checkbox = opt.querySelector("input[type='checkbox']");
      if (checkbox && checkbox.checked) {
        const img = opt.querySelector("img")?.outerHTML || "";
        const details = opt.querySelector(".option-details")?.cloneNode(true);

        const textarea = details.querySelector("textarea");
        if (textarea) textarea.remove();

        const commentText = opt.querySelector("textarea")?.value?.trim();
        const commentHTML = commentText ? `<div class="comment">Comment: ${commentText}</div>` : '';

        const qty = parseInt(opt.querySelector("input[type='number']")?.value || 1);
        const price = parseFloat(checkbox.getAttribute('data-price')) || 0;
        total += price * qty;

        catContent += `<div class="option">${img}<div class="option-details">${details.innerHTML}<div><strong>Qty:</strong> ${qty}</div>${commentHTML}</div></div>`;
        catHasSelections = true;
      }
    });

    if (catHasSelections) html += catContent;
  });

  html += `<div class="total-line">Total: $${total.toLocaleString()}</div>`;
  html += "</body></html>";

  try {
    const response = await fetch("/.netlify/functions/generate-page", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ address, htmlTemplate: html, base64 })
    });

    const result = await response.json();
    document.body.removeChild(loading);

    if (response.ok) {
      alert("Wishlist page created! Link copied to clipboard.");
      navigator.clipboard.writeText(result.url);
      window.open(result.url, "_blank");
    } else {
      alert("Error: " + result.body);
    }
  } catch (err) {
    document.body.removeChild(loading);
    alert("Unexpected error: " + err.message);
  }
}
</script>
<script>
async function exportLookbook() {
  const address = document.getElementById("address-input").value.trim();
  if (!address) {
    alert("Please enter an address.");
    return;
  }

  const base64 = localStorage.getItem("workbook");
  if (!base64) {
    alert("No workbook found. Please upload a file first.");
    return;
  }

  const html = document.documentElement.outerHTML;

  try {
    const response = await fetch('/.netlify/functions/generate-page', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ address, htmlTemplate: html, base64 })
    });

    const result = await response.json();

    if (response.ok) {
      alert("Page created! Link copied to clipboard.");
      navigator.clipboard.writeText(result.url);
      window.open(result.url, "_blank");
    } else {
      alert("Failed to create page: " + result.body);
    }
  } catch (error) {
    alert("Unexpected error: " + error.message);
  }
}
</script>
<script>
async function saveToSupabase() {
  let address = document.getElementById("address-input")?.value?.trim();
  if (!address) {
    const pathParts = window.location.pathname.split("/");
    address = pathParts[pathParts.length - 1]
      .replace(".html", "")
      .replace("/", "");
  }

  if (!address) {
    alert("Address not found.");
    return;
  }

  const selections = [];
  document.querySelectorAll('.option').forEach(option => {
    const checkbox = option.querySelector('input[type="checkbox"]');
    if (checkbox?.checked) {
      const qty = parseInt(option.querySelector('input[type="number"]')?.value || 1);
      const comment = option.querySelector('textarea')?.value?.trim() || '';
      const optionNumber = option.querySelector('.option-details strong')?.innerText?.split("—")[0]?.trim();

      selections.push({
        option: optionNumber,
        qty,
        comment
      });
    }
  });

  if (selections.length === 0) {
    alert("No selections to save.");
    return;
  }

  const response = await fetch('/.netlify/functions/save-selections', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ address, selections })
  });

  if (response.ok) {
    alert("Selections saved!");
  } else {
    const err = await response.text();
    alert("Error saving selections: " + err);
  }
}
</script>
